name: Update rates & deploy

on:
  schedule:
    # Sri Lanka is UTC+5:30. Banks publish in the morning and sometimes revise intraday.
    - cron: "30 4 * * *"   # 10:00 Colombo
    - cron: "30 9 * * *"   # 15:00 Colombo
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days of CBSL history to (re)fetch"
        default: "14"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape banks + CBSL
        run: python scraper/run.py --backfill-days "${{ github.event.inputs.backfill_days || '14' }}"
      - name: Commit data
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet || git commit -m "Rates update $(TZ=Asia/Colombo date +'%Y-%m-%d %H:%M')"
          git push

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the data commit made by the scrape job
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: mkdir _site && cp -r index.html assets data _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
